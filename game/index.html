<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier: Harbor Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1622; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sky Courier: Harbor Run. A chase-view flight game. Take off, fly through the glowing rings, and land on the far runway. Arrow keys or mouse steer, W and S or the mouse wheel set the throttle."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
